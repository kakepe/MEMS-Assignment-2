<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="MEMS system architecture and tenant isolation"><title>MEMS system architecture and tenant isolation</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#40576b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#183447;font-size:18px}.title{font-size:21px;font-weight:bold}.small{font-size:16px}.key{font-family:Consolas,monospace;font-size:15px}.label{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}.edge{fill:none;stroke:#40576b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="white"/><rect x="370" y="15" width="790" height="95" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="384" y="44" class="title">MEMS.AppHost — Aspire orchestration</text><text x="384" y="72" class="small">References, configuration, WaitFor/readiness, SQL volume and dashboard.</text><text x="384" y="97" class="small">Runtime resources: Admin, API, Public gateway/WASM, SQL Server.</text><rect x="370" y="145" width="790" height="675" rx="12" fill="#f8fafb" stroke="#8fa3b3" stroke-dasharray="8 5"/><text x="390" y="175" class="small">Server resources and shared server-side libraries</text><path d="M760 110V145" class="edge dash"/><text x="775" y="134" class="small label">orchestrates</text><rect x="15" y="200" width="325" height="355" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="29" y="229" class="title">MEMS.Public (browser WASM)</text><text x="29" y="257" class="small">One reusable app; Shared DTOs only.</text><text x="29" y="282" class="small">Anonymous tenant experiences:</text><rect x="30" y="300" width="295" height="43" rx="6" fill="#dbeafa"/><text x="42" y="327" class="">/burnaby — Burnaby only</text><rect x="30" y="355" width="295" height="43" rx="6" fill="#dcefe5"/><text x="42" y="382" class="">/surrey — Surrey only</text><rect x="30" y="410" width="295" height="43" rx="6" fill="#eee0ed"/><text x="42" y="437" class="">/richmond — Richmond only</text><text x="30" y="492" class="small">Guide choices: native sessionStorage</text><text x="30" y="519" class="small">Tenant ID keys; never sent to backend.</text><rect x="405" y="210" width="285" height="95" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="419" y="239" class="title">Public gateway</text><text x="419" y="267" class="small">Root SPA + same-origin API proxy.</text><text x="419" y="292" class="small">Managed runtime, not project #8.</text><rect x="815" y="210" width="310" height="95" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="829" y="239" class="title">MEMS.Admin</text><text x="829" y="267" class="small">Shared Blazor Server UI at /admin.</text><text x="829" y="292" class="small">Identity login + server authorization.</text><rect x="405" y="380" width="285" height="100" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="419" y="409" class="title">MEMS.Api</text><text x="419" y="437" class="small">WebAPI + safe JSON DTOs.</text><text x="419" y="462" class="small">Slug + actor checks, scoped media.</text><rect x="815" y="380" width="310" height="120" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="829" y="409" class="title">MEMS.Data</text><text x="829" y="437" class="small">Shared services, EF Core and Identity.</text><text x="829" y="462" class="small">Admin: a fresh scope per operation.</text><text x="829" y="487" class="small">Tenant filters + validated writes.</text><path d="M340 255H405" class="edge "/><text x="345" y="242" class="small label">HTTPS</text><path d="M545 305V380" class="edge "/><text x="410" y="350" class="small label">JSON GETs for public data</text><path d="M690 430H815" class="edge "/><text x="720" y="418" class="small label">services</text><path d="M970 305V380" class="edge "/><text x="830" y="345" class="small label">shared authorized services</text><path d="M815 283H750V405H690" class="edge dash"/><text x="700" y="328" class="small label">API discovery/probe</text><rect x="405" y="535" width="285" height="70" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="419" y="564" class="title">MEMS.Shared</text><text x="419" y="592" class="small">Safe DTOs + validation contracts.</text><path d="M405 565H340" class="edge dash"/><text x="344" y="590" class="small label">contracts</text><rect x="815" y="575" width="310" height="130" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="829" y="604" class="title">SQL Server — Docker</text><text x="829" y="632" class="small">Database: MEMSAssignment2.</text><text x="829" y="657" class="small">Tenant-aware keys/FKs + Identity.</text><text x="829" y="682" class="small">No voter selections or vote totals.</text><path d="M970 500V575" class="edge "/><text x="980" y="545" class="small label">EF Core / SQL Server</text><text x="825" y="740" class="small">Volume: mems-assignment2-sql-data</text><text x="825" y="766" class="small">Mounted at /var/opt/mssql</text><rect x="405" y="665" width="285" height="100" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="419" y="694" class="title">MEMS.ServiceDefaults</text><text x="419" y="722" class="small">Admin/API health, logging, tracing,</text><text x="419" y="747" class="small">service discovery. Server-only library.</text><rect x="15" y="660" width="325" height="100" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="29" y="689" class="title">Aspire dashboard</text><text x="29" y="717" class="small">Readiness, structured logs, traces.</text><text x="29" y="742" class="small">No browser voting telemetry.</text><path d="M405 715H340" class="edge dash"/><text x="345" y="700" class="small label">OTLP</text><text x="20" y="805" class="small">Isolation: URL slug → tenant-aware service/query → composite SQL ownership constraints. Super Admin has authorized system scope.</text></svg>