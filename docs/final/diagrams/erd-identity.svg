<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 850" role="img" aria-label="SQL Server Identity and history ERD"><title>SQL Server Identity and history ERD</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#40576b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#183447;font-size:18px}.title{font-size:21px;font-weight:bold}.small{font-size:16px}.key{font-family:Consolas,monospace;font-size:15px}.label{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}.edge{fill:none;stroke:#40576b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="28" class="title">Identity and history ERD — all remaining SQL tables</text><rect x="15" y="70" width="245" height="105" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="29" y="99" class="title">Municipalities</text><path d="M15 112H260" stroke="#94aabb"/><text x="27" y="135" class="key">PK MunicipalityId</text><text x="27" y="159" class="key">Referenced tenant owner.</text><rect x="295" y="70" width="280" height="201" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="309" y="99" class="title">AspNetUsers</text><path d="M295 112H575" stroke="#94aabb"/><text x="307" y="135" class="key">PK Id : nvarchar(128)</text><text x="307" y="159" class="key">AK (Id,Scope)</text><text x="307" y="183" class="key">FK MunicipalityId : int?</text><text x="307" y="207" class="key">Scope : int [1 System;2 Tenant]</text><text x="307" y="231" class="key">UQ NormalizedUserName</text><text x="307" y="255" class="key">PasswordHash + Identity fields</text><rect x="630" y="70" width="240" height="153" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="644" y="99" class="title">AspNetUserRoles</text><path d="M630 112H870" stroke="#94aabb"/><text x="642" y="135" class="key">PK/FK (UserId,RoleId)</text><text x="642" y="159" class="key">Scope : int</text><text x="642" y="183" class="key">FK (UserId,Scope)</text><text x="642" y="207" class="key">FK (RoleId,Scope)</text><rect x="925" y="70" width="310" height="177" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="939" y="99" class="title">AspNetRoles</text><path d="M925 112H1235" stroke="#94aabb"/><text x="937" y="135" class="key">PK Id : nvarchar(128)</text><text x="937" y="159" class="key">AK (Id,Scope)</text><text x="937" y="183" class="key">FK MunicipalityId : int?</text><text x="937" y="207" class="key">Scope : int</text><text x="937" y="231" class="key">UQ NormalizedName</text><path d="M260 130H295" class="edge "/><text x="262" y="116" class="small label">0..1</text><path d="M575 165H630" class="edge "/><text x="582" y="151" class="small label">1 : *</text><path d="M925 165H870" class="edge "/><text x="878" y="151" class="small label">1 : *</text><path d="M140 70V42H1080V70" class="edge "/><text x="405" y="56" class="small label">Municipality 0..1 : 0..* named roles</text><rect x="15" y="410" width="260" height="129" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="29" y="439" class="title">AspNetUserClaims</text><path d="M15 452H275" stroke="#94aabb"/><text x="27" y="475" class="key">PK Id : int</text><text x="27" y="499" class="key">FK UserId</text><text x="27" y="523" class="key">ClaimType, ClaimValue</text><rect x="325" y="410" width="300" height="129" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="339" y="439" class="title">AspNetUserLogins</text><path d="M325 452H625" stroke="#94aabb"/><text x="337" y="475" class="key">PK (LoginProvider,ProviderKey)</text><text x="337" y="499" class="key">FK UserId</text><text x="337" y="523" class="key">ProviderDisplayName</text><rect x="670" y="410" width="300" height="129" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="684" y="439" class="title">AspNetUserTokens</text><path d="M670 452H970" stroke="#94aabb"/><text x="682" y="475" class="key">PK (UserId,LoginProvider,Name)</text><text x="682" y="499" class="key">FK UserId</text><text x="682" y="523" class="key">Value</text><rect x="1010" y="410" width="225" height="129" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="1024" y="439" class="title">AspNetRoleClaims</text><path d="M1010 452H1235" stroke="#94aabb"/><text x="1022" y="475" class="key">PK Id : int</text><text x="1022" y="499" class="key">FK RoleId</text><text x="1022" y="523" class="key">ClaimType, ClaimValue</text><path d="M385 271V335H145V410" class="edge "/><text x="320" y="330" class="small label">1 : 0..* user-owned claims/logins/tokens</text><path d="M435 271V410" class="edge "/><path d="M485 271V350H815V410" class="edge "/><path d="M1080 247V410" class="edge "/><text x="1095" y="340" class="small label">1 : 0..*</text><rect x="15" y="650" width="330" height="105" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="29" y="679" class="title">SeedHistory</text><path d="M15 692H345" stroke="#94aabb"/><text x="27" y="715" class="key">PK SeedKey : nvarchar(80)</text><text x="27" y="739" class="key">CompletedAtUtc : datetime2</text><rect x="390" y="650" width="400" height="105" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="404" y="679" class="title">__EFMigrationsHistory</text><path d="M390 692H790" stroke="#94aabb"/><text x="402" y="715" class="key">PK MigrationId : nvarchar(150)</text><text x="402" y="739" class="key">ProductVersion : nvarchar(32)</text><text x="825" y="682" class="small">Scope 2 user: exactly one tenant.</text><text x="825" y="709" class="small">Scope 1 user: no tenant (system).</text><text x="825" y="736" class="small">Membership scope must match user + role.</text><text x="825" y="763" class="small">Named tenant-role matching also validated</text><text x="825" y="787" class="small">by Identity store; claims/tokens use cascades.</text></svg>