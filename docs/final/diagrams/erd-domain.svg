<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 760" role="img" aria-label="SQL Server domain ERD"><title>SQL Server domain ERD</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#40576b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#183447;font-size:18px}.title{font-size:21px;font-weight:bold}.small{font-size:16px}.key{font-family:Consolas,monospace;font-size:15px}.label{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}.edge{fill:none;stroke:#40576b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="white"/><text x="20" y="30" class="title">Domain ERD — actual SQL tables, PK/FK/UQ keys</text><rect x="20" y="65" width="365" height="297" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="34" y="94" class="title">Municipalities</text><path d="M20 107H385" stroke="#94aabb"/><text x="32" y="130" class="key">PK MunicipalityId : int</text><text x="32" y="154" class="key">UQ Slug : nvarchar(80)</text><text x="32" y="178" class="key">UQ Name : nvarchar(100)</text><text x="32" y="202" class="key">Province : nvarchar(50)</text><text x="32" y="226" class="key">ElectionDate : date</text><text x="32" y="250" class="key">Description : nvarchar(2000)</text><text x="32" y="274" class="key">LogoFileName : nvarchar(160)?</text><text x="32" y="298" class="key">BrandColor : nvarchar(7)</text><text x="32" y="322" class="key">PublicTitle : nvarchar(120)</text><text x="32" y="346" class="key">RowVersion : rowversion</text><rect x="450" y="65" width="325" height="225" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="464" y="94" class="title">Positions</text><path d="M450 107H775" stroke="#94aabb"/><text x="462" y="130" class="key">PK PositionId : int</text><text x="462" y="154" class="key">FK MunicipalityId : int</text><text x="462" y="178" class="key">Name : nvarchar(100)</text><text x="462" y="202" class="key">SeatsAvailable : int [1..100]</text><text x="462" y="226" class="key">RowVersion : rowversion</text><text x="462" y="250" class="key">AK (MunicipalityId,PositionId)</text><text x="462" y="274" class="key">UQ (MunicipalityId,Name)</text><rect x="850" y="65" width="375" height="321" rx="9" fill="#f5f8fa" stroke="#94aabb"/><text x="864" y="94" class="title">Candidates</text><path d="M850 107H1225" stroke="#94aabb"/><text x="862" y="130" class="key">PK CandidateId : int</text><text x="862" y="154" class="key">FK MunicipalityId : int</text><text x="862" y="178" class="key">FK PositionId : int</text><text x="862" y="202" class="key">Name : nvarchar(100)</text><text x="862" y="226" class="key">Profile : nvarchar(4000)</text><text x="862" y="250" class="key">PhotoFileName : nvarchar(160)?</text><text x="862" y="274" class="key">Email : nvarchar(254)?</text><text x="862" y="298" class="key">Website : nvarchar(300)?</text><text x="862" y="322" class="key">DateCreated : datetime2 UTC</text><text x="862" y="346" class="key">RowVersion : rowversion</text><text x="862" y="370" class="key">UQ DemoSeedKey : nvarchar(80)?</text><path d="M385 140H450" class="edge "/><text x="388" y="126" class="small label">1 : 0..*</text><path d="M775 190H850" class="edge "/><text x="780" y="176" class="small label">1 : 0..*</text><path d="M200 362V440H1040V387" class="edge "/><text x="390" y="427" class="small label">Municipality 1 : 0..* Candidate (direct FK)</text><rect x="20" y="500" width="1205" height="210" rx="9" fill="#edf4f7" stroke="#94aabb"/><text x="34" y="529" class="title">Database integrity and privacy</text><text x="34" y="557" class="small">Candidate (MunicipalityId, PositionId) → Position (MunicipalityId, PositionId): cross-tenant parent assignments fail in SQL.</text><text x="34" y="582" class="small">Restrict parent deletes while positions, candidates or administrator assignments depend on the municipality/position.</text><text x="34" y="607" class="small">Normalized unique slugs, scoped position names, length/format checks and row-version optimistic concurrency.</text><text x="34" y="632" class="small">DemoSeedKey is a nullable filtered unique seed identity; completed seed batches do not reset edited/deleted samples.</text><text x="34" y="657" class="small">No ballot, voter selection, running tally or voter account table exists. Identity and history tables appear on the next ERD.</text></svg>